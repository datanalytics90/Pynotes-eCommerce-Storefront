{% if messages %}
<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 mt-4 space-y-2" x-data="{ shown: true }">
  {% for message in messages %}
    <div x-show="shown" x-init="setTimeout(() => shown = false, 6000)"
         class="rounded-lg px-4 py-3 text-sm font-medium flex items-start justify-between gap-4
         {% if message.tags == 'success' %}bg-green-50 text-green-800 border border-green-200
         {% elif message.tags == 'error' %}bg-red-50 text-red-800 border border-red-200
         {% elif message.tags == 'warning' %}bg-amber-50 text-amber-800 border border-amber-200
         {% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}">
      <span>{{ message }}</span>
      <button @click="shown = false" class="shrink-0 opacity-60 hover:opacity-100">&times;</button>
    </div>
  {% endfor %}
</div>
{% endif %}
