<div class="announcement">
  {% if announcement_messages %}
    {% for m in announcement_messages %}
      <span data-announcement {% if not forloop.first %}style="display:none"{% endif %}>{{ m.text }}</span>
    {% endfor %}
  {% else %}
    <span>Printed coding notes made to learn, write and grow &middot; Shop PyNotes</span>
  {% endif %}
</div>
