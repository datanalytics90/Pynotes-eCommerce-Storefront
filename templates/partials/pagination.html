{% if page_obj.paginator.num_pages > 1 %}
<nav class="d-flex justify-content-center gap-2 mt-5" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <a href="?{% if query %}q={{ query }}&{% endif %}{% if current_category %}category={{ current_category }}&{% endif %}page={{ page_obj.previous_page_number }}" class="btn btn-outline-dark rounded-pill btn-sm">Previous</a>
  {% endif %}
  <span class="align-self-center text-secondary small">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a href="?{% if query %}q={{ query }}&{% endif %}{% if current_category %}category={{ current_category }}&{% endif %}page={{ page_obj.next_page_number }}" class="btn btn-outline-dark rounded-pill btn-sm">Next</a>
  {% endif %}
</nav>
{% endif %}
