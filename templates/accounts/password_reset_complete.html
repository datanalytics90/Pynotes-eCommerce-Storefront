{% extends "base.html" %}
{% block title %}Password changed — {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="mx-auto max-w-md px-4 sm:px-6 lg:px-8 py-16 text-center">
  <h1 class="text-2xl font-extrabold text-slate-900 mb-3">Password changed</h1>
  <p class="text-slate-600 mb-6">Your password has been set. You can now sign in.</p>
  <a href="{% url 'accounts:login' %}" class="btn-primary inline-flex">Sign in</a>
</section>
{% endblock %}
