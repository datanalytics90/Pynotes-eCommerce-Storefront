[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "RUF012", # mutable class defaults are the normal/idiomatic way to write Django Meta options
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
